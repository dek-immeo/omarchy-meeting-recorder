[package]
name = "meeting-transcriber"
version = "0.2.0"
edition = "2024"

[dependencies]
transcribe-cpp = "=0.4.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std","load-dynamic","api-23"] }
realfft = "3"
hound = "3.5"
tempfile = "3"
sha2 = "0.10"
rubato = "0.16"
curl = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
